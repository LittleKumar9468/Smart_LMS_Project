<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter - {{ chapter.title }}</title>
    <script src="//cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] text-slate-800 flex h-screen overflow-hidden font-sans">

    <!-- DEEP NAVY SIDEBAR WITH SVG ICONS -->
    <div class="w-64 bg-[#0b1324] text-white flex flex-col justify-between border-r border-slate-800/80 select-none shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-white/5">
                <div class="bg-blue-600 p-2 rounded-xl shadow-md">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/></svg>
                </div>
                <span class="font-bold text-base tracking-wide text-white">Smart LMS</span>
            </div>
            <div class="px-5 pt-5 pb-2 text-[11px] font-semibold tracking-wider text-slate-500 uppercase">Admin Portal</div>
            <nav class="px-3 space-y-1.5">
                <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/courses" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition bg-[#162d50]/80 text-white border border-blue-400/20 shadow-inner">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                    <span>Course Manager</span>
                </a>
                <a href="/admin/ai_quiz" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <span>AI Quiz Lab</span>
                </a>
                <a href="/admin/assignments" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span>Assign Task</span>
                </a>
                <a href="/admin/students" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>Student List</span>
                </a>
                <a href="/admin/performance" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    <span>Student Performance</span>
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-white/5">
            <a href="/logout" class="flex items-center justify-center gap-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Logout</a>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-screen overflow-y-auto">
        <div class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <a href="/manage_course/{{ course._id }}" class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    <span>Back to Chapters</span>
                </a>
                <h2 class="text-sm font-bold text-slate-800">{{ course.title }} / <span class="text-blue-600">{{ chapter.title }}</span></h2>
            </div>

            <button onclick="copyContent()" id="copyBtn" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-semibold text-xs transition shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <span id="copyText">Copy Content</span>
            </button>
        </div>

        <div class="p-8 max-w-5xl mx-auto w-full">
            <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200">
                <h1 class="text-2xl font-black text-slate-900 mb-6 border-b border-slate-100 pb-4">{{ chapter.title }}</h1>
                <div id="chapter-content" class="text-slate-700 text-base leading-relaxed whitespace-pre-wrap">{{ chapter.content }}</div>
            </div>
        </div>
    </div>

    <script>
        function copyContent() {
            const content = document.getElementById('chapter-content').innerText;
            navigator.clipboard.writeText(content).then(() => {
                const txt = document.getElementById('copyText');
                txt.innerText = 'Copied';
                setTimeout(() => { txt.innerText = 'Copy Content'; }, 2500);
            });
        }
    </script>
</body>
</html>
